<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>⚡ Mega Quiz Maths - R213 & Suites</title>
    <style>
        :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #c9d1d9; --blue: #58a6ff; --green: #238636; --orange: #d29922; --red: #da3633; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 1100px; width: 100%; }
        
        .header { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 20px; }
        h1 { color: var(--blue); margin: 0; font-size: 1.8rem; }
        
        .stats-bar { display: flex; justify-content: space-between; margin-bottom: 15px; font-family: monospace; font-size: 1.1rem; }
        #timer { color: var(--orange); font-weight: bold; }

        .main-layout { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 25px; position: relative; }
        .q-text { font-size: 1.3rem; font-weight: 600; margin-bottom: 20px; color: #fff; line-height: 1.4; }
        
        .options { display: grid; gap: 12px; }
        .opt { background: #21262d; border: 1px solid var(--border); color: var(--text); padding: 15px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 1rem; transition: all 0.2s; }
        .opt:hover { background: #30363d; border-color: var(--blue); }
        .opt.selected { background: #1f6feb; border-color: #58a6ff; color: white; box-shadow: 0 0 10px rgba(88,166,255,0.3); }

        .scratchpad { background: #000; border: 1px dashed var(--blue); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; }
        textarea { width: 100%; height: 350px; background: transparent; border: none; color: #3fb950; font-family: 'Consolas', monospace; resize: none; outline: none; font-size: 0.95rem; }
        
        .btn-action { width: 100%; padding: 15px; margin-top: 20px; border-radius: 8px; border: none; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        #btn-next { background: var(--green); color: white; }
        #btn-next:hover { opacity: 0.8; }

        /* Résultats */
        #results-screen { display: none; text-align: center; }
        .final-score { font-size: 5rem; font-weight: 900; color: var(--blue); margin: 10px 0; }
        .correction-scroll { max-height: 500px; overflow-y: auto; text-align: left; margin-top: 30px; padding-right: 10px; }
        .corr-card { background: #0d1117; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--red); }
        .corr-card.is-correct { border-left-color: var(--green); }
        
        @media (max-width: 850px) { .main-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 Entraînement Intensif : Maths Réseaux & Systèmes</h1>
        <p style="color: #8b949e; margin: 5px 0 0 0;">Inspiré des modules R213 - Partie 1 et 2</p>
    </div>

    <div id="quiz-ui">
        <div class="stats-bar">
            <span id="progress-text">Question 1 / 15</span>
            <span id="timer">00:00</span>
        </div>

        <div class="main-layout">
            <div class="card">
                <div class="q-text" id="q-content">Chargement...</div>
                <div class="options" id="opt-container"></div>
                <button class="btn-action" id="btn-next" onclick="validateAnswer()">Valider la réponse</button>
            </div>

            <div class="scratchpad">
                <h4 style="margin: 0 0 10px 0; color: var(--blue);">📝 Brouillon & Notes</h4>
                <textarea placeholder="Calcule ici... 
Exemple Pivot de Gauss :
L2 <- L2 - 2*L1
L3 <- L3 + L1"></textarea>
            </div>
        </div>
    </div>

    <div id="results-screen" class="card">
        <h2>Bilan de l'examen</h2>
        <div class="final-score" id="score-text">0/20</div>
        <p id="comment-text" style="font-size: 1.2rem;"></p>
        <div class="correction-scroll" id="correction-list"></div>
        <button class="btn-action" style="background: var(--blue); color: white;" onclick="location.reload()">Générer un nouveau test (Questions aléatoires)</button>
    </div>
</div>

<script>
    // BASE DE DONNÉES MASSIVE (40 Questions)
    const rawDB = [
        // SERIES
        { q: "Quelle est la nature de la série Σ(1/n) ?", a: ["Convergente", "Divergente (Harmonique)", "Alternée"], c: 1, e: "Série de Riemann avec α=1. Elle diverge." },
        { q: "La série Σ(1/n²) est convergente car :", a: ["C'est une série de Riemann avec α > 1", "Son terme tend vers 0", "Elle est alternée"], c: 0, e: "Critère de Riemann : converge si α > 1." },
        { q: "Si la limite de uₙ est 1, que dire de Σuₙ ?", a: ["Elle converge", "Elle diverge grossièrement", "On ne peut pas savoir"], c: 1, e: "Condition nécessaire : lim uₙ doit être 0 pour converger." },
        { q: "Critère de d'Alembert : Si L = lim |uₙ₊₁/uₙ| = 1, alors :", a: ["Ça converge", "Ça diverge", "On ne peut pas conclure"], c: 2, e: "Le cas L=1 est le cas douteux de d'Alembert." },
        { q: "Une série alternée Σ(-1)ⁿ aₙ converge si :", a: ["aₙ est croissante", "aₙ décroît vers 0", "aₙ est constante"], c: 1, e: "C'est le critère de Leibniz." },
        { q: "Σ (1/2)ⁿ est une série :", a: ["Géométrique convergente", "Géométrique divergente", "De Riemann"], c: 0, e: "Raison q=1/2, donc |q|<1." },
        
        // MATRICES
        { q: "Le produit A(3x2) * B(2x5) donne une matrice de taille :", a: ["3x5", "2x2", "5x3"], c: 0, e: "Lignes de la 1ère, colonnes de la 2ème." },
        { q: "Une matrice A est inversible si et seulement si :", a: ["det(A) = 0", "det(A) ≠ 0", "A est rectangulaire"], c: 1, e: "Le déterminant est la clé de l'inversion." },
        { q: "L'inverse d'une matrice Identité I est :", a: ["Zéro", "L'Identité I elle-même", "Sa transposée uniquement"], c: 1, e: "I * I = I, donc I⁻¹ = I." },
        { q: "Dans A*X = B, si A est inversible, alors X = :", a: ["B * A⁻¹", "A⁻¹ * B", "B / A"], c: 1, e: "L'ordre compte ! A⁻¹ est à gauche." },
        { q: "La transposée d'une matrice symétrique est :", a: ["Son opposée", "Elle-même", "L'identité"], c: 1, e: "Par définition, tA = A pour une symétrique." },
        
        // RECURRENCE & SUITES
        { q: "Dans P(n), l'étape 'Hérédité' sert à prouver :", a: ["P(0)", "P(n) => P(n+1)", "La limite"], c: 1, e: "On montre que la vérité se transmet au rang suivant." },
        { q: "Une suite (uₙ) est minorée si :", a: ["uₙ < M", "uₙ > m", "lim uₙ = 0"], c: 1, e: "m est un plancher que la suite ne dépasse pas vers le bas." },
        { q: "Suite arithmético-géométrique uₙ₊₁ = auₙ + b. Si a=1 :", a: ["Elle est géométrique", "Elle est arithmétique", "Elle est constante"], c: 1, e: "Elle devient uₙ₊₁ = uₙ + b." },
        { q: "Le principe de récurrence s'applique sur quel ensemble ?", a: ["R (Réels)", "N (Entiers naturels)", "C (Complexes)"], c: 1, e: "C'est un raisonnement par 'sauts' discrets." },

        // GAUSS & SYSTEMES
        { q: "Quelle opération est interdite sur les lignes (Gauss) ?", a: ["L1 <-> L2", "L1 <- L1 + L2", "L1 <- 0 * L1"], c: 2, e: "On ne peut pas multiplier une ligne par 0 (on perd l'équation)." },
        { q: "Un système est dit 'Triangulaire' si :", a: ["Il a 3 équations", "Il y a des 0 sous la diagonale", "Toutes les inconnues sont égales"], c: 1, e: "C'est la forme idéale pour la résolution remontante." },
        { q: "Le pivot de Gauss permet de calculer :", a: ["Le déterminant", "L'inverse d'une matrice", "Les deux"], c: 2, e: "On peut faire les deux avec Gauss (méthode de Gauss-Jordan)." },

        // TELECOMS (PDF PAGE 1)
        { q: "Pourquoi utilise-t-on les suites en Télécoms ?", a: ["Pour modéliser des signaux continus", "Pour modéliser des paquets de données discrets", "Pour décorer les rapports"], c: 1, e: "Les réseaux fonctionnent par envois successifs (discrets)." },
        { q: "Une atténuation de signal de 10% par km se modélise par :", a: ["Suite géométrique q=0.9", "Suite arithmétique r=-0.1", "Suite géométrique q=1.1"], c: 0, e: "Diminuer de 10% revient à multiplier par 0.9." },
        
        // NOUVELLES QUESTIONS (POUR ARRIVER A 40)
        { q: "Somme d'une série géométrique convergente Σ qⁿ (1er terme a) :", a: ["a / (1-q)", "a * q / (1-q)", "n * q"], c: 0, e: "Formule : S = Premier Terme / (1 - Raison)." },
        { q: "Si A est une matrice 4x4, son rang maximum est :", a: ["16", "4", "8"], c: 1, e: "Le rang ne peut pas dépasser le nombre de lignes/colonnes." },
        { q: "La suite uₙ = (-1)ⁿ est :", a: ["Convergente", "Divergente", "Croissante"], c: 1, e: "Elle oscille entre -1 et 1, pas de limite unique." },
        { q: "Que vaut I² (Matrice Identité au carré) ?", a: ["2I", "I", "0"], c: 1, e: "L'identité multipliée par elle-même reste l'identité." },
        { q: "Une matrice dont le déterminant est nul est dite :", a: ["Régulière", "Singulière", "Parfaite"], c: 1, e: "Singulière = Non inversible." },
        { q: "La série Σ (n / n+1) est :", a: ["Convergente", "Divergente", "Nulle"], c: 1, e: "Le terme tend vers 1 (≠0), donc divergence grossière." },
        { q: "Quelle est la dérivée matricielle ? (Hors programme mais bonus)", a: ["On dérive chaque coefficient", "On dérive juste la diagonale", "Impossible"], c: 0, e: "On dérive terme à terme." },
        { q: "Un système avec plus d'inconnues que d'équations a souvent :", a: ["0 solution", "1 solution", "Une infinité de solutions"], c: 2, e: "S'il est compatible, il y a des variables libres." },
        { q: "La trace d'une matrice est :", a: ["Le produit de la diagonale", "La somme de la diagonale", "Le déterminant"], c: 1, e: "Somme des éléments aᵢᵢ." },
        { q: "Si uₙ₊₁ - uₙ > 0, la suite est :", a: ["Croissante", "Décroissante", "Constante"], c: 0, e: "Définition de la croissance." },
        { q: "Le critère de Cauchy porte sur :", a: ["La limite du rapport", "La limite de la racine n-ième", "La somme partielle"], c: 1, e: "lim (uₙ)^(1/n) = L." },
        { q: "Une matrice carrée A est symétrique si :", a: ["A = -tA", "A = tA", "det(A) = 1"], c: 1, e: "La transposée est égale à l'originale." },
        { q: "Σ 1/(n²+1) converge par comparaison à :", a: ["Σ 1/n", "Σ 1/n²", "Σ 1"], c: 1, e: "1/(n²+1) < 1/n², qui converge (Riemann)." },
        { q: "L'opération L2 <- L2 + L1 change-t-elle le déterminant ?", a: ["Oui", "Non", "Seulement si L1 est nulle"], c: 1, e: "L'ajout d'une ligne à une autre ne change pas le det." },
        { q: "Une suite uₙ = n² + 1 est majorée ?", a: ["Oui", "Non", "Seulement par 0"], c: 1, e: "Elle tend vers +∞, donc pas de plafond." },
        { q: "Le terme général d'une suite géométrique est uₙ = :", a: ["u₀ + n*q", "u₀ * qⁿ", "u₀ + q"], c: 1, e: "Formule de croissance exponentielle." },
        { q: "Si A et B sont inversibles, (AB)⁻¹ = :", a: ["A⁻¹B⁻¹", "B⁻¹A⁻¹", "AB"], c: 1, e: "On inverse l'ordre lors de l'inversion du produit." },
        { q: "Une série à termes positifs ne peut que :", a: ["Converger ou diverger vers +∞", "Osciller", "Converger vers -1"], c: 0, e: "La somme ne peut que croître." },
        { q: "Le rang d'une matrice Identité Iₙ est :", a: ["0", "1", "n"], c: 2, e: "Toutes les colonnes sont linéairement indépendantes." },
        { q: "La limite de (1 + 1/n)ⁿ quand n->∞ est :", a: ["1", "e (Exponentielle)", "0"], c: 1, e: "Définition classique du nombre e." }
    ];

    let quiz = [];
    let current = 0;
    let score = 0;
    let time = 0;
    let selectedIdx = -1;
    let history = [];

    function initQuiz() {
        // Mélanger et prendre 15 questions
        quiz = rawDB.sort(() => Math.random() - 0.5).slice(0, 15);
        renderQuestion();
        startTimer();
    }

    function renderQuestion() {
        selectedIdx = -1;
        const data = quiz[current];
        document.getElementById('progress-text').innerText = `Question ${current + 1} / ${quiz.length}`;
        document.getElementById('q-content').innerText = data.q;
        
        const container = document.getElementById('opt-container');
        container.innerHTML = '';
        data.a.forEach((txt, i) => {
            const b = document.createElement('button');
            b.className = 'opt';
            b.innerText = txt;
            b.onclick = () => {
                selectedIdx = i;
                document.querySelectorAll('.opt').forEach(el => el.classList.remove('selected'));
                b.classList.add('selected');
            };
            container.appendChild(b);
        });
    }

    function validateAnswer() {
        if(selectedIdx === -1) return;
        
        const isCorrect = selectedIdx === quiz[current].c;
        if(isCorrect) score++;
        
        history.push({ 
            q: quiz[current].q, 
            isOk: isCorrect, 
            user: quiz[current].a[selectedIdx], 
            right: quiz[current].a[quiz[current].c],
            expl: quiz[current].e
        });

        current++;
        if(current < quiz.length) renderQuestion(); else showResults();
    }

    function showResults() {
        document.getElementById('quiz-ui').style.display = 'none';
        document.getElementById('results-screen').style.display = 'block';
        
        const finalNote = (score / quiz.length) * 20;
        document.getElementById('score-text').innerText = `${finalNote.toFixed(1)}/20`;
        
        const pct = (score / quiz.length) * 100;
        let comment = pct >= 80 ? "Excellent ! Tu maîtrises le module R213." : pct >= 50 ? "Pas mal, encore quelques révisions sur les matrices !" : "Attention, reprends bien les bases des séries et de Gauss.";
        document.getElementById('comment-text').innerText = comment;

        const list = document.getElementById('correction-list');
        list.innerHTML = "";
        history.forEach(h => {
            list.innerHTML += `
                <div class="corr-card ${h.isOk ? 'is-correct' : ''}">
                    <strong>${h.q}</strong><br>
                    <span style="color:${h.isOk ? '#238636' : '#da3633'}">Ta réponse : ${h.user}</span><br>
                    ${!h.isOk ? `<span style="color:#58a6ff">La bonne : ${h.right}</span><br>` : ''}
                    <small style="font-style:italic; color:#8b949e">💡 ${h.expl}</small>
                </div>
            `;
        });
    }

    function startTimer() {
        setInterval(() => {
            time++;
            let m = Math.floor(time/60).toString().padStart(2,'0');
            let s = (time%60).toString().padStart(2,'0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }, 1000);
    }

    initQuiz();
</script>
</body>
</html>
